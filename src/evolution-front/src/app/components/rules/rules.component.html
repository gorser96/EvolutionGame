<div class="rules__row-container">
  <div class="rules__back-button-container">
    <button class="app-button" [routerLink]="['/menu']">
      <fa-icon [icon]="faReply"></fa-icon>
    </button>
  </div>
  <div class="rules-slideshow-container">
    <div class="slideshow-container">
      <div
        class="mySlides fade"
        [style.display]="currentSlide == 1 ? 'block' : 'none'"
      >
        <img src="/assets/images/img1.jpg" />
        <div class="text">Caption Text</div>
      </div>

      <div
        class="mySlides fade"
        [style.display]="currentSlide == 2 ? 'block' : 'none'"
      >
        <img src="/assets/images/img2.jpg" />
        <div class="text">Caption Two</div>
      </div>

      <div
        class="mySlides fade"
        [style.display]="currentSlide == 3 ? 'block' : 'none'"
      >
        <img src="/assets/images/img3.jpg" />
        <div class="text">Caption Three</div>
      </div>

      <!-- Next and previous buttons -->
      <a class="prev" (click)="plusSlides(-1)">&#10094;</a>
      <a class="next" (click)="plusSlides(1)">&#10095;</a>
    </div>

    <!-- The dots/circles -->
    <div style="text-align: center">
      <span class="dot" (click)="setSlide(1)"></span>
      <span class="dot" (click)="setSlide(2)"></span>
      <span class="dot" (click)="setSlide(3)"></span>
    </div>
  </div>
</div>
